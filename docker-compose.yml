services:
  api:
    build: .
    image: gridpulse:latest
    ports:
      - "8000:8000"
    volumes:
      - ./gridpulse.duckdb:/app/gridpulse.duckdb
      - ./models/artifacts:/app/models/artifacts
      - ./data:/app/data
      - ./docs/corpus:/app/docs/corpus
    env_file: .env
    environment:
      GRIDPULSE_DB: /app/gridpulse.duckdb
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    image: gridpulse:latest
    ports:
      - "8501:8501"
    volumes:
      - ./gridpulse.duckdb:/app/gridpulse.duckdb
      - ./models/artifacts:/app/models/artifacts
      - ./data:/app/data
      - ./docs/corpus:/app/docs/corpus
    env_file: .env
    environment:
      GRIDPULSE_DB: /app/gridpulse.duckdb
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
